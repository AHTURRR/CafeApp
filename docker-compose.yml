# Pengembangan lokal CafeApp (Laravel API). P1 menambah: queue, reverb, redis.
services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cafeapp
      POSTGRES_USER: cafeapp
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafeapp -d cafeapp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
